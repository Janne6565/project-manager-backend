server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ProjectManager
  security:
    user:
      # Bootstrap owner credentials. Consumed once by OwnerSeeder when no OWNER exists yet
      # (SPRING_SECURITY_USER_PASSWORD in the cluster). No longer an in-memory login.
      name: janne
      password: adminpassword
      roles: ADMIN

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates against it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Existing production DB (created by the previous ddl-auto=update) is baselined at V1
    # without executing it; fresh databases run V1 then V2.
    baseline-on-migrate: true
    # Vendor-specific DDL: {vendor} resolves to `postgresql` (cluster) or `h2` (local/tests).
    locations: classpath:db/migration/{vendor}

  datasource:
    url: jdbc:h2:file:./data;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password

management:
  server:
    # Actuator lives on its own port, outside the /api/v1 context path. The public Ingress
    # routes the whole /api/ prefix to 8080, so on the app port /api/v1/actuator/** would be
    # reachable from the internet. No Ingress points at 8081; only the k8s probes and the
    # in-cluster Alloy scrape (ServiceMonitor) use it.
    port: 8081
  endpoints:
    web:
      exposure:
        # Health (k8s probes) + Prometheus scrape endpoint.
        include: health,prometheus
  endpoint:
    health:
      # Expose /actuator/health/{liveness,readiness} for the Kubernetes probes.
      probes:
        enabled: true
  metrics:
    tags:
      # Stamp every meter with the app name so a shared backend can tell services apart.
      application: ${spring.application.name}
    # The whole cluster shares Grafana Cloud's 10k-series free tier, so this service is
    # kept lean (budget: <= 200 series).
    distribution:
      # Client-side percentiles instead of a bucket histogram: Alloy drops every `_bucket`
      # series anyway. Percentiles are computed in this JVM and cannot be re-aggregated
      # across replicas; fine at one replica, revisit before scaling out. No p50: with ~20
      # endpoints it would push this service past its budget, and _sum/_count give the mean.
      percentiles-histogram:
        http.server.requests: false
      percentiles:
        http.server.requests: 0.95, 0.99
    # Meter families nobody reads, cut for the series budget.
    enable:
      spring.security: false
      spring.data.repository: false
      tomcat.sessions: false
      jvm.buffer: false
      jvm.classes: false
      jvm.compilation: false
      executor: false
      tasks.scheduled: false
      application.started.time: false
      application.ready.time: false
      http.server.requests.active: false
      process.files: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
  issuer: project-manager
  cookie:
    secure: ${JWT_COOKIE_SECURE:true}

projectmanager:
  frontend:
    # Where OAuth callbacks redirect the browser after login (success -> /, failure -> /login?oauthError=...).
    url: ${PROJECTMANAGER_FRONTEND_URL:http://localhost:5173}
  oauth:
    # Federated OIDC login (Authentik). client-id/secret injected via env in real deployments.
    providers:
      authentik:
        client-id: ${PROJECTMANAGER_OAUTH_CLIENT_ID:}
        client-secret: ${PROJECTMANAGER_OAUTH_CLIENT_SECRET:}
        authorization-uri: https://sso.jannekeipert.de/application/o/authorize/
        token-uri: https://sso.jannekeipert.de/application/o/token/
        user-info-uri: https://sso.jannekeipert.de/application/o/userinfo/
        scope: "openid email profile"
        callback-uri: ${PROJECTMANAGER_OAUTH_CALLBACK_URI:http://localhost:8080/api/v1/auth/oauth/authentik/callback}
    # Authentik groups that gate access and map to the coarse role.
    groups:
      admin: project-manager-admins
      user: project-manager-users

cors:
  enabled: true
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8081
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true
  max-age: 3600

external:
  contributions:
    url: https://project-fetcher.jannekeipert.de/api
