apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-manager
  template:
    metadata:
      labels:
        app: project-manager
    spec:
      containers:
        - name: project-manager
          image: ghcr.io/janne6565/project-manager-backend:1.3.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          env:
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: project-manager-secret
                  key: password
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/projectmanager
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: org.postgresql.Driver
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: org.hibernate.dialect.PostgreSQLDialect
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: validate
            - name: CORS_ALLOWED_ORIGINS
              value: "https://project-manager.jannekeipert.de,https://projektejwkk.de,https://jannekeipert.de,http://localhost:5173"
            - name: PROJECTMANAGER_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: project-manager-secret
                  key: oauthClientId
            - name: PROJECTMANAGER_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: project-manager-secret
                  key: oauthClientSecret
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: project-manager-secret
                  key: jwtSecret
            - name: PROJECTMANAGER_FRONTEND_URL
              value: "https://project-manager.jannekeipert.de"
            - name: PROJECTMANAGER_OAUTH_CALLBACK_URI
              value: "https://project-manager.jannekeipert.de/api/v1/auth/oauth/authentik/callback"
          # Actuator runs on the management port (8081), outside the /api/v1 context path.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
